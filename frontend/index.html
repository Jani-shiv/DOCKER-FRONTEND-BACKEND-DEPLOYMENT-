<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Frontend-Backend Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .card {
      width: min(720px, 92%);
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .services {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 24px 0;
    }

    .service {
      padding: 8px 14px;
      border-radius: 20px;
      background: #e8f5e9;
      color: #166534;
      font-size: 14px;
      font-weight: 600;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    pre {
      margin-top: 24px;
      padding: 18px;
      min-height: 100px;
      background: #eef2ff;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Docker Compose Demo</h1>

    <p>
      This application demonstrates communication between
      separate Frontend and Backend Docker containers.
    </p>

    <div class="services">
      <span class="service">Frontend: Nginx</span>
      <span class="service">Backend: Flask API</span>
      <span class="service">Network: Docker Bridge</span>
    </div>

    <button id="test-button">
      Test Backend Connection
    </button>

    <pre id="result">Click the button to test the API.</pre>
  </main>

  <script>
    const button = document.getElementById("test-button");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      result.textContent = "Connecting to backend...";

      try {
        const response = await fetch("/api/message");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          `Connection failed: ${error.message}`;
      }
    });
  </script>
</body>
</html>
